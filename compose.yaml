services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: haravatat
      POSTGRES_USER: haravatat
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U haravatat -d haravatat']
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [database]
  app:
    build:
      context: .
      target: application
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://haravatat:${POSTGRES_PASSWORD}@db:5432/haravatat
      APP_ORIGIN: ${APP_ORIGIN:?Set an HTTPS APP_ORIGIN}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      COMPILER_URL: http://compiler:3001
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      db:
        condition: service_healthy
      compiler:
        condition: service_healthy
    read_only: true
    tmpfs: ['/tmp:size=256m,uid=1000,gid=1000']
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 1g
    pids_limit: 128
    networks: [default, database, compilation]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
  compiler:
    build:
      context: .
      target: compiler
    restart: unless-stopped
    read_only: true
    tmpfs: ['/tmp:size=256m,uid=1000,gid=1000']
    volumes:
      - typst_packages:/packages:ro
    cap_drop: [ALL]
    security_opt: ['no-new-privileges:true']
    mem_limit: 2g
    cpus: 1.0
    pids_limit: 64
    networks: [compilation]
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  database:
  typst_packages:
networks:
  database:
    internal: true
  compilation:
    internal: true
